server:
  port: 8080
  forward-headers-strategy: framework


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        enabled: true
        lower-case-service-id: true
        predicates:
          - name: Path
            args:
              pattern: "'/${app.api-prefix}/' + serviceId.replace('-service', '') + '/**'"
        filters:
          - name: RewritePath
            args:
              regexp: "'/' + serviceId.replace('-service', '') + '/?(?<remaining>.*)'"
              replacement: "'/${remaining}'"
      forwarded:
        enabled: true

      # Cấu hình CORS toàn cục
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "https://your-production-app.com"
              - "https://www.google.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    enabled: true
app:
  shared-secret: ${SHARED_SECRET:g3eXe2BAcd2w17dhRWKdjT9MM9MSAAMUN4D9xfAtIJ/9u0muMGFwPRewhcOa4GbN6nXZ2fWFzqVfAUkGZwr95w==}
  security:
    public-endpoints:
      - "/identity/auth/**"
      - "/notification/api/notifications/health"
      - "/identity/skill/user"
  api-prefix: ${API_PREFIX:/api/}