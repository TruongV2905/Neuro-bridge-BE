server:
  port: 8088
  forward-headers-strategy: framework

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/report
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  threads:
    virtual:
      enabled: true
  main:
    allow-circular-references: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs

jwt:
  signerKey: "AQmfYttUwrlZyk8pIHcEBP3WoQEcmlq5z2brmlu/+4ImpbwLBywUMtSUgm13H+iSUsWe58/Q7vZH3nmbP8Jg4g=="

app:
  security:
    public-endpoints:
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/public/**"
