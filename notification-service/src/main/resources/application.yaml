server:
  port: 8083

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification?createDatabaseIfNotExist=true
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      # Chỉ định rõ Dialect cho PostgreSQL
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      properties:
        hibernate:
          jdbc:
            lob:
              non_contextual_creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}

app:
  security:
    public-endpoints:
      - "/api/notifications/health"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
  shared-secret: ${SHARED_SECRET:justi_secret_key_2026}
  notification:
    from-email: ${FROM_EMAIL:noreply@yourapp.com}
    from-name: ${FROM_NAME:Your App}
