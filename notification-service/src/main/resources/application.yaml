debug: true
server:
  port: 8086

spring:
  main:
    web-application-type: servlet

  # ← THÊM CORS CONFIG VÀO ĐÂY
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://103.180.138.143"  # ← IP của bạn
        - "https://your-production-app.com"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600
  # ← HẾT CORS CONFIG

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      ...