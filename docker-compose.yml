services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
#      - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - microservice-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - microservice-network

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6379:6379"
    networks:
      - microservice-network

  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - microservice-network

  # 2. Cập nhật Identity Service
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "4561:4561"
      - "9090:9090"
      - "9091:9091"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      PAYMENT_GRPC_HOST: payment-service
    networks:
      - microservice-network

  workspace-service:
    build:
      context: ./workspace-service
      dockerfile: Dockerfile
    container_name: workspace-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      discovery:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      IDENTITY_GRPC_HOST: identity-service
      JOBPOST_GRPC_HOST: jobpost-service
      PAYMENT_GRPC_HOST: payment-service
    networks:
      - microservice-network

  jobpost-service:
    build:
      context: ./jobPost-service
      dockerfile: Dockerfile
    container_name: jobpost-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "4562:4562"
      - "9094:9094"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_SERVERS: kafka:29092
      EUREKA_SERVER: http://discovery:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      IDENTITY_GRPC_HOST: identity-service
      WORKSPACE_GRPC_HOST: workspace-service
      PAYMENT_GRPC_HOST: payment-service
    networks:
      - microservice-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      discovery:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_URLS: http://+:8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:29092
      EUREKA_SERVER: http://discovery:8761/eureka/
    networks:
      - microservice-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    env_file: .env
    depends_on:
      - discovery
      - identity-service
      - redis
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVER: http://discovery:8761/eureka/
      APP_SHARED-SECRET: ${SHARED_SECRET}
    networks:
      - microservice-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    ports:
      - "4564:4564"
      - "9095:9095"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER: http://discovery:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      IDENTITY_GRPC_HOST: identity-service
      JOBPOST_GRPC_HOST: jobpost-service
    networks:
      - microservice-network

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    ports:
      - "4565:4565"
    environment:
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_URLS: http://+:4565
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chat
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER: http://discovery:8761/eureka/
      IDENTITY_GRPC_HOST: identity-service
      WORKSPACE_GRPC_HOST: workspace-service
      GEMINI_API_KEY: ${GEMINI_API_KEY:AQ.Ab8RN6JNPGDR1T38xQtsbIg8GkYu-cr5aPnQTNtOTYf4QgktzQ}
    networks:
      - microservice-network

  rate-service:
    build:
      context: ./rate-service
      dockerfile: Dockerfile
    container_name: rate-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    ports:
      - "8087:8087"
      - "9097:9097"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVER: http://discovery:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      IDENTITY_GRPC_HOST: identity-service
      WORKSPACE_GRPC_HOST: workspace-service
    networks:
      - microservice-network

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: report-service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_SERVERS: kafka:29092
      EUREKA_SERVER: http://discovery:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge

volumes:
  postgres-data-v2:
    driver: local