debug: true

#logging:
#  level:
#    org.springframework.beans.factory: DEBUG
#    org.springframework.context.annotation: DEBUG

server:
  port: 4564
  forward-headers-strategy: framework
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:103.180.138.143}:5432/payment
    username: postgres
    password: ${DB_PASSWORD:SWD392@server}
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign sẽ tự động dùng Thread của Virtual Threads
            loggerLevel: BASIC
  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
springdoc:
  api-docs:
    path: /v3/api-docs
grpc:
  server:
    port: 9095
  client:
    identity-service:
      address: discovery:///identity-service
      negotiation-type: plaintext
    jobpost-service:
      address: discovery:///jobpost-service
      negotiation-type: plaintext
