server:
  port: 4561
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://localhost:3306/identity
    username: root
    password: 12345678
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign sẽ tự động dùng Thread của Virtual Threads
            loggerLevel: BASIC
  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
      show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-exclude: /internal/**


jwt:
  signerKey: "AQmfYttUwrlZyk8pIHcEBP3WoQEcmlq5z2brmlu/+4ImpbwLBywUMtSUgm13H+iSUsWe58/Q7vZH3nmbP8Jg4g=="
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in seconds

app:
  shared-secret: "g3eXe2BAcd2w17dhRWKdjT9MM9MSAAMUN4D9xfAtIJ/9u0muMGFwPRewhcOa4GbN6nXZ2fWFzqVfAUkGZwr95w=="
