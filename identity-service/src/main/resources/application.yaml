server:
  port: 4561
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:103.180.138.143}:5432/identity
    username: postgres
    password: ${DB_PASSWORD:SWD392@server}
    driver-class-name: org.postgresql.Driver
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign sẽ tự động dùng Thread của Virtual Threads
            loggerLevel: BASIC
  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    show-sql: true
  ai:
    openai:
      api-key: AQ.Ab8RN6JNPGDR1T38xQtsbIg8GkYu-cr5aPnQTNtOTYf4QgktzQ

      chat:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        completions-path: /chat/completions
        options:
          model: gemini-2.5-flash

      embedding:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        embeddings-path: /embeddings
        options:
          model: gemini-embedding-001
          dimensions: 1536

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
  #Redis
  data:
    redis:
      host: ${REDIS_HOST:103.180.138.143}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:12345678}
#      database: ${REDIS_DATABASE:0}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
springdoc:
  api-docs:
    path: /v3/api-docs
# gRPC Server Configuration
grpc:
  server:
    port: 9091
    enable-keep-alive: true
  client:
    payment-service:
      address: static://localhost:9095
      negotiation-type: plaintext
jwt:
  signerKey: "AQmfYttUwrlZyk8pIHcEBP3WoQEcmlq5z2brmlu/+4ImpbwLBywUMtSUgm13H+iSUsWe58/Q7vZH3nmbP8Jg4g=="
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in seconds
  refresh-duration: 30 # in minutes
app:
  security:
    public-endpoints:
      - "/auth/**"
      - "/skill/user"
      - "/swagger-ui/**"
      - "/v3/api-docs/**"
      - "/public/**"