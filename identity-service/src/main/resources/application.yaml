server:
  port: 4561
  forward-headers-strategy: framework

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/identity
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign sẽ tự động dùng Thread của Virtual Threads
            loggerLevel: BASIC
  #Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: 12345678
      database: 0


  main:
    allow-circular-references: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
    generate-ddl: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: localhost
springdoc:
  api-docs:
    path: /v3/api-docs


