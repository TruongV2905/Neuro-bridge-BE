syntax = "proto3";

package com.workspace.grpc;

option java_multiple_files = true;
option java_package = "com.workspace.grpc";

import "google/protobuf/timestamp.proto";

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspaceById(GetWorkspaceByIdRequest) returns (WorkspaceResponse);
  rpc GetProjectById(GetProjectByIdRequest) returns (ProjectResponse);
}

message CreateWorkspaceRequest {
  string job_id = 1;
  string escrow_id = 2;
  string client_id = 3;
  string expert_id = 4;
  string project_name = 5;
  google.protobuf.Timestamp deadline = 6;
}

message CreateWorkspaceResponse {
  string workspace_id = 1;
  bool success = 2;
  string message = 3;
}

message GetWorkspaceByIdRequest {
  string workspace_id = 1;
}

message GetProjectByIdRequest {
  string project_id = 1;
}

message ProjectResponse {
  string project_id = 1;
  string workspace_id = 2;
  string client_id = 3;
  string expert_id = 4;
  string status = 5;             // ProjectState: IN_PROGRESS/UNDER_REVIEW/.../COMPLETED
  float progress_percentage = 6;
}

message WorkspaceResponse {
  string workspace_id = 1;
  string job_id = 2;
  string client_id = 3;
  string expert_id = 4;
  string status = 5;
}

