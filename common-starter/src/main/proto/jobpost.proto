syntax = "proto3";

package com.jobpost.grpc;

option java_multiple_files = true;
option java_package = "com.jobpost.grpc";

message JobIdRequest {
  string job_id = 1;
}

message ProposalIdRequest {
  string proposal_id = 1;
}

message ProposalUnlockResponse {
  string proposal_unlock_id = 1;
  string strategy_detail = 2;
}

message ProposalUnlockStatusResponse {
  string proposal_id = 1;
  bool unlocked = 2;
}

message ProposalUnlockInfoResponse {
  string proposal_id = 1;
  string expert_code = 2;
  string amount = 3; // BigDecimal as string to preserve precision
}

message ProposalUnlockUpdateRequest {
  string proposal_unlock_id = 1;
  string strategy_detail = 2;
}

message CreateProposalUnlockRequest {
  string job_id = 1;
  string strategy_detail = 2;
}

service ProposalUnlockGrpcService {
  rpc GetApprovedProposalUnlock(JobIdRequest) returns (ProposalUnlockResponse);
  rpc UpdateProposalUnlock(ProposalUnlockUpdateRequest) returns (ProposalUnlockResponse);
  rpc UnlockProposal(ProposalIdRequest) returns (ProposalUnlockStatusResponse);
  rpc GetProposalUnlockInfo(ProposalIdRequest) returns (ProposalUnlockInfoResponse);
  rpc createProposalUnlockForJob(CreateProposalUnlockRequest) returns (ProposalUnlockResponse);
}